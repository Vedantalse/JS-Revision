```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Manager</h1>
        <p class="subtitle">Enter student details and marks</p>

        <form id="resultForm">

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter student name">
            </div>

            <div class="form-group">
                <label for="rollNo">Roll Number</label>
                <input type="text" id="rollNo" placeholder="Enter roll number">
            </div>

            <h2>Subject Marks</h2>

            <div class="marks-grid">

                <div class="form-group">
                    <label for="subject1">Subject 1</label>
                    <input type="number" id="subject1" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="subject2">Subject 2</label>
                    <input type="number" id="subject2" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="subject3">Subject 3</label>
                    <input type="number" id="subject3" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="subject4">Subject 4</label>
                    <input type="number" id="subject4" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="subject5">Subject 5</label>
                    <input type="number" id="subject5" min="0" max="100">
                </div>

            </div>

            <button type="submit">Calculate Result</button>

        </form>

        <div class="result-card" id="resultCard">

            <h2>Result</h2>

            <p>Name: <span id="resultName">-</span></p>
            <p>Roll Number: <span id="resultRollNo">-</span></p>
            <p>Total Marks: <span id="resultTotal">-</span></p>
            <p>Percentage: <span id="resultPercentage">-</span></p>
            <p>Grade: <span id="resultGrade">-</span></p>
            <p>Status: <span id="resultStatus">-</span></p>

        </div>

    </div>

</body>
</html>
```
